name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, for example: feat(battle): add critical-hit test"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up build dependencies
        uses: ./.github/actions/setup-build

      - name: Build
        run: make -j"$(nproc)"

      - name: Check for modified tracked files
        run: |
          if ! git diff-index --quiet HEAD --; then
            echo 'Uncommitted changes detected:'
            git diff-index HEAD --
            exit 1
          fi

      - name: Stage release files
        run: |
          mkdir release
          cp pokered.gbc        release/pokemon-red.gbc
          cp pokered.map        release/pokemon-red.map
          cp pokered.sym        release/pokemon-red.sym
          cp pokeblue.gbc       release/pokemon-blue.gbc
          cp pokeblue.map       release/pokemon-blue.map
          cp pokeblue.sym       release/pokemon-blue.sym
          cp pokegreen.gbc      release/pokemon-green.gbc
          cp pokegreen.map      release/pokemon-green.map
          cp pokegreen.sym      release/pokemon-green.sym
          cp pokered_debug.gbc  release/pokemon-red-debug.gbc
          cp pokered_debug.map  release/pokemon-red-debug.map
          cp pokered_debug.sym  release/pokemon-red-debug.sym
          cp pokeblue_debug.gbc release/pokemon-blue-debug.gbc
          cp pokeblue_debug.map release/pokemon-blue-debug.map
          cp pokeblue_debug.sym release/pokemon-blue-debug.sym

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pokemon-rgb-build
          path: release/
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Run unit tests
        run: python -m pytest tools/rom_tests/tests/unit

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: pokemon-rgb-build
          path: release

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rom_tests/requirements.txt

      - name: Install ROM test dependencies
        run: python -m pip install -r tools/rom_tests/requirements.txt

      - name: Run end-to-end tests
        env:
          ROM_TEST_ROM: release/pokemon-blue-debug.gbc
          ROM_TEST_SYMBOLS: release/pokemon-blue-debug.sym
        run: >-
          python -m pytest
          tools/rom_tests/tests/e2e

      - name: Upload end-to-end test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rom-test-failures
          path: test-results/
          if-no-files-found: ignore
